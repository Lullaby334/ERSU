{% extends 'base.html' %}
{% block title %}{{ title }} | ERSU{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card border-0 shadow-sm text-center">
      <div class="card-body p-5">
        <div class="display-4 fw-bold mb-3">{{ title }}</div>
        <h1 class="h4 mb-3">Wystąpił problem</h1>
        <p class="text-muted mb-4">{{ message }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary">Wróć na stronę główną</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
