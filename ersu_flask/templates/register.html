{% extends 'base.html' %}
{% block title %}Rejestracja | ERSU{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4 p-lg-5">
        <h1 class="h3 mb-4 text-center">Załóż konto</h1>
        <form method="post">
          <div class="mb-3">
            <label for="full_name" class="form-label">Imię i nazwisko</label>
            <input type="text" class="form-control" id="full_name" name="full_name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Adres e-mail</label>
            <input type="email" class="form-control" id="email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Hasło</label>
            <input type="password" class="form-control" id="password" name="password" required>
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">Rola</label>
            <select class="form-select" id="role" name="role" required>
              {% for role in roles %}
                <option value="{{ role }}">{{ get_role_label(role) }}</option>
              {% endfor %}
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100">Utwórz konto</button>
        </form>
        <p class="text-center text-muted mt-3 mb-0">Masz już konto? <a href="{{ url_for('login') }}">Przejdź do logowania</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
