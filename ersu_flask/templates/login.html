{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<section class="form-wrap card narrow">
    <h1>Вход</h1>
    <form method="post" class="form-grid">
        <label>Email
            <input type="email" name="email" required>
        </label>
        <label>Пароль
            <input type="password" name="password" required>
        </label>
        <button class="btn" type="submit">Войти</button>
    </form>
    <p class="muted">Демо-пользователи создаются через seed.sql.</p>
</section>
{% endblock %}
